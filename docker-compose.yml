services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./documents:/app/documents
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # 前端 middleware 在服务端把 /api 代理到后端并注入 X-API-Key（不进入浏览器）
      - BACKEND_URL=http://backend:8000
      # 若后端 .env 配置了 API_KEY，这里填同一个值（仅服务端可见）
      - API_KEY=${API_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped
